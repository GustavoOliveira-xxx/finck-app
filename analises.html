<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinCK | Análises</title>
  <meta name="description" content="Veja para onde vai seu dinheiro por categoria e como isso se traduz em tempo de trabalho.">
  <link rel="icon" href="assets/favicon-finck.png" type="image/png">
  <meta name="theme-color" content="#07060a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icone-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinCK">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style-principal.css">
  <link rel="stylesheet" href="css/finck-fx.css">
</head>
<body data-page="relatorios">
  <div class="finck-carga" data-finck-carga aria-hidden="true">
    <div class="finck-carga__nucleo">
      <svg class="finck-carga__orbitas" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="finck-carga__anel finck-carga__anel--externo" cx="110" cy="110" r="104"/>
        <circle class="finck-carga__anel finck-carga__anel--medio" cx="110" cy="110" r="88"/>
        <g class="finck-carga__satelite-g">
          <circle class="finck-carga__satelite" cx="110" cy="6" r="5"/>
        </g>
        <g class="finck-carga__satelite-g finck-carga__satelite-g--2">
          <circle class="finck-carga__satelite finck-carga__satelite--roxo" cx="110" cy="22" r="3.5"/>
        </g>
      </svg>
      <img class="finck-carga__logo" src="assets/logo-ck-256.png" alt="" decoding="async">
    </div>
    <p class="finck-carga__marca">FinCK</p>
    <p class="finck-carga__frase">Traduzindo preço em tempo de vida…</p>
    <div class="finck-carga__barra"><span class="finck-carga__preenche"></span></div>
  </div>

  <header data-finck-header></header>

  <main class="conteudo">
    <section class="hero">
      <h2>Análises</h2>
      <p>Para onde seu dinheiro está indo — e quanto do seu tempo isso representa.</p>
    </section>

    <section class="filtros">
      <label>Período
        <select id="filtroPeriodo">
          <option value="mes">Mês atual</option>
          <option value="3">Últimos 3 meses</option>
          <option value="6" selected>Últimos 6 meses</option>
          <option value="tudo">Tudo</option>
        </select>
      </label>
    </section>

    <section class="cards-indicadores" id="resumoAnalises"></section>

    <section class="bloco">
      <h3>Gastos por categoria</h3>
      <canvas id="graficoCategorias" width="600" height="320" role="img" aria-label="Gráfico de gastos por categoria"></canvas>
      <ul class="lista-categorias" id="listaCategorias"></ul>
    </section>

    <section class="bloco">
      <h3>Evolução mensal</h3>
      <canvas id="graficoMensal" width="600" height="320" role="img" aria-label="Gráfico de entradas e saídas por mês"></canvas>
    </section>

    <section class="bloco">
      <h3>Consumo consciente</h3>
      <div id="blocoConsciente"></div>
    </section>
  </main>

  <nav class="nav-inferior" data-finck-nav aria-label="Navegação principal"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reality.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/gamification-engine.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/analises.js"></script>
  <script src="js/ui-fx.js"></script>
  <script src="js/finck-fx.js"></script>
</body>
</html>
