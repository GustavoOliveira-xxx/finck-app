<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinCK | Relatórios</title>
  <meta name="description" content="Relatório mensal do FinCK com movimentações, metas e decisões conscientes; exporte em CSV, JSON ou PDF.">
  <link rel="icon" href="assets/favicon-finck.png" type="image/png">
  <meta name="theme-color" content="#07060a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icone-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinCK">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style-principal.css">
  <link rel="stylesheet" href="css/finck-fx.css">
</head>
<body data-page="relatorios">
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="finck-carga" data-finck-carga aria-hidden="true">
    <div class="finck-carga__nucleo">
      <svg class="finck-carga__orbitas" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="finck-carga__anel finck-carga__anel--externo" cx="110" cy="110" r="104"/>
        <circle class="finck-carga__anel finck-carga__anel--medio" cx="110" cy="110" r="88"/>
        <g class="finck-carga__satelite-g">
          <circle class="finck-carga__satelite" cx="110" cy="6" r="5"/>
        </g>
        <g class="finck-carga__satelite-g finck-carga__satelite-g--2">
          <circle class="finck-carga__satelite finck-carga__satelite--roxo" cx="110" cy="22" r="3.5"/>
        </g>
      </svg>
      <img class="finck-carga__logo" src="assets/logo-ck-256.png" alt="" decoding="async">
    </div>
    <p class="finck-carga__marca">FinCK</p>
    <p class="finck-carga__frase">Traduzindo preço em tempo de vida…</p>
    <div class="finck-carga__barra"><span class="finck-carga__preenche"></span></div>
  </div>

  <header data-finck-header></header>

  <main class="conteudo" id="conteudo" tabindex="-1">
    <section class="hero">
      <h2>Relatórios</h2>
      <p>Consolide o mês e leve seus dados com você.</p>
    </section>

    <section class="filtros">
      <label>Mês de referência
        <input type="month" id="filtroMes">
      </label>
      <div class="acoes-exportar">
        <button type="button" class="btn-secundario" id="btnCSV">Exportar CSV</button>
        <button type="button" class="btn-secundario" id="btnJSON">Backup JSON</button>
        <button type="button" class="btn-secundario" id="btnPDF">Imprimir / PDF</button>
      </div>
    </section>

    <section class="cards-indicadores" id="resumoMes"></section>

    <section class="bloco">
      <h3>Decisões conscientes do mês</h3>
      <div id="decisoesMes"></div>
    </section>

    <section class="bloco">
      <h3>Movimentações do mês</h3>
      <div class="tabela-wrapper">
        <table class="tabela" id="tabelaTransacoes">
          <thead>
            <tr><th scope="col">Data</th><th scope="col">Descrição</th><th scope="col">Categoria</th><th scope="col">Tipo</th><th scope="col">Valor</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="vazio" id="vazioRelatorio" hidden>Nenhuma movimentação neste mês.</p>
    </section>

    <section class="bloco">
      <h3>Metas</h3>
      <div class="tabela-wrapper">
        <table class="tabela" id="tabelaMetas">
          <thead>
            <tr><th scope="col">Meta</th><th scope="col">Guardado</th><th scope="col">Objetivo</th><th scope="col">Progresso</th><th scope="col">Prazo</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <nav class="nav-inferior" data-finck-nav aria-label="Navegação principal"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reality.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/gamification-engine.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/relatorios.js"></script>
  <script src="js/ui-fx.js"></script>
  <script src="js/finck-fx.js"></script>
</body>
</html>
