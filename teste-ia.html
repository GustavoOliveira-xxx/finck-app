<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste FINCK AI</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f1115; color: #e8e8e8; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; }
    textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1d23; color: #e8e8e8; font-size: 15px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 18px; border: none; border-radius: 8px; background: #4ade80; color: #0f1115; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #saida { margin-top: 20px; padding: 14px; border-radius: 8px; background: #1a1d23; white-space: pre-wrap; min-height: 40px; }
    #modelo { margin-top: 8px; font-size: 12px; color: #888; }
    label { display: block; margin-top: 14px; font-size: 14px; color: #bbb; }
    #contexto { height: 80px; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Teste da FINCK AI</h1>
  <p>Página de desenvolvimento, só para confirmar a conexão FinCK, Vercel e OpenRouter.</p>

  <label for="pergunta">Pergunta</label>
  <textarea id="pergunta">Me dê 3 dicas curtas para economizar dinheiro no mês.</textarea>
  <label for="contexto">Contexto (opcional): números de uma análise, um por linha</label>
  <textarea id="contexto" placeholder="Compra: R$ 800,00 à vista&#10;Renda considerada: R$ 3.500,00 por mês"></textarea>
  <button id="enviar">Perguntar</button>

  <div id="saida" aria-live="polite">A resposta vai aparecer aqui.</div>
  <div id="modelo"></div>

  <script>
    const botao = document.getElementById('enviar');
    const saida = document.getElementById('saida');
    const modelo = document.getElementById('modelo');

    botao.addEventListener('click', async () => {
      const pergunta = document.getElementById('pergunta').value;
      const contexto = document.getElementById('contexto').value.trim();
      botao.disabled = true;
      // Só a etapa que de fato acontece: o pedido saiu e a resposta não voltou.
      saida.textContent = 'Enviando a pergunta…';
      modelo.textContent = '';

      try {
        const r = await fetch('/api/ia', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(contexto ? { pergunta, contexto } : { pergunta })
        });
        const dados = await r.json();

        if (dados.resposta) {
          saida.textContent = dados.resposta;
          const seg = (dados.tempo_ms / 1000).toFixed(1).replace('.', ',');
          modelo.textContent = 'Modelo usado: ' + dados.modelo + ' · ' + seg + ' s';
        } else {
          saida.textContent = 'Erro: ' + (dados.erro || 'resposta vazia');
        }
      } catch (e) {
        saida.textContent = 'Erro de conexão: ' + e.message;
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
