<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinCK | Decisões conscientes</title>
  <meta name="description" content="Histórico das análises do FinCK of Reality e das decisões de compra registradas.">
  <link rel="icon" href="assets/favicon-finck.png" type="image/png">
  <meta name="theme-color" content="#07060a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icone-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinCK">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style-principal.css">
  <link rel="stylesheet" href="css/finck-fx.css">
</head>
<body data-page="reality">
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <div class="finck-carga finck-carga--cofre" data-finck-carga aria-hidden="true">
    <div class="cofre">
      <div class="cofre__folha cofre__folha--topo">
        <span class="cofre__grade"></span>
        <span class="cofre__borda"></span>
      </div>
      <div class="cofre__folha cofre__folha--base">
        <span class="cofre__grade"></span>
        <span class="cofre__borda"></span>
      </div>

      <div class="cofre__nucleo">
        <div class="cofre__selo">
          <svg class="cofre__anel" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="cofre__anel-base" cx="60" cy="60" r="52"></circle>
            <circle class="cofre__anel-arco" cx="60" cy="60" r="52"
                    stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
          </svg>
          <img class="cofre__logo" src="assets/logo-ck-256.png" alt="" decoding="async">
        </div>
        <p class="cofre__marca">FinCK</p>
        <p class="cofre__pct" data-cofre-pct>0%</p>
      </div>

      <span class="cofre__fresta"></span>
    </div>
  </div>

  <header data-finck-header></header>

  <main class="conteudo" id="conteudo" tabindex="-1">
    <section class="hero">
      <h2>Decisões conscientes</h2>
      <p>Tudo o que você analisou antes de comprar, e o que decidiu em cada caso.</p>
    </section>

    <section class="cards-indicadores" id="resumoDecisoes"></section>

    <section class="bloco">
      <div class="bloco-cabecalho">
        <h3>Histórico</h3>
        <label class="filtro">Filtrar
          <select id="filtroDecisao">
            <option value="">Todas as decisões</option>
          </select>
        </label>
      </div>
      <div id="listaDecisoes" class="itens-lista"></div>
      <p class="vazio" id="vazioDecisoes" hidden>Nenhuma análise registrada ainda. <a href="reality.html">Analisar uma compra</a>.</p>
    </section>

    <p class="link-rodape"><a href="reality.html">← Voltar ao FinCK of Reality</a></p>
  </main>

  <nav class="nav-inferior" data-finck-nav aria-label="Navegação principal"></nav>

  <div id="modalDetalhe" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="tituloDetalhe">
    <div class="modal">
      <button type="button" class="fechar" data-fechar="modalDetalhe" aria-label="Fechar">✕</button>
      <h3 id="tituloDetalhe">Detalhe da análise</h3>
      <div id="conteudoDetalhe"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reality.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/tempo.js"></script>
  <script src="js/gamification-engine.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/decisoes.js"></script>
  <script src="js/ui-fx.js"></script>
  <script src="js/finck-fx.js"></script>
</body>
</html>
