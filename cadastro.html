<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCK | Criar conta</title>
  <meta name="description" content="Crie sua conta no FinCK e comece a analisar suas compras antes de gastar.">
  <link rel="icon" href="assets/favicon-finck.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style-auth.css">
  <link rel="stylesheet" href="css/finck-fx.css">
</head>
<body data-page="cadastro" class="pagina-auth">
  <div class="finck-carga" data-finck-carga aria-hidden="true">
    <div class="finck-carga__nucleo">
      <svg class="finck-carga__orbitas" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="finck-carga__anel finck-carga__anel--externo" cx="110" cy="110" r="104"/>
        <circle class="finck-carga__anel finck-carga__anel--medio" cx="110" cy="110" r="88"/>
        <g class="finck-carga__satelite-g">
          <circle class="finck-carga__satelite" cx="110" cy="6" r="5"/>
        </g>
        <g class="finck-carga__satelite-g finck-carga__satelite-g--2">
          <circle class="finck-carga__satelite finck-carga__satelite--roxo" cx="110" cy="22" r="3.5"/>
        </g>
      </svg>
      <img class="finck-carga__logo" src="assets/logo-ck.png" alt="" decoding="async">
    </div>
    <p class="finck-carga__marca">FinCK</p>
    <p class="finck-carga__frase">Traduzindo preço em tempo de vida…</p>
    <div class="finck-carga__barra"><span class="finck-carga__preenche"></span></div>
  </div>

  <main class="auth-wrapper">
    <section class="auth-marca">
      <img src="assets/logo-ck.png" alt="Conscious Knowledge" class="auth-logo">
      <h1>FinCK</h1>
      <p class="auth-tagline">Consumo consciente começa com informação clara.</p>
    </section>

    <section class="auth-card">
      <h2>Criar conta</h2>
      <p class="auth-sub">Leva menos de um minuto.</p>

      <form id="cadastroForm" novalidate>
        <label for="nome">Nome
          <input type="text" id="nome" name="nome" autocomplete="name" required placeholder="Como quer ser chamado(a)">
        </label>

        <label for="emailCad">E-mail
          <input type="email" id="emailCad" name="email" autocomplete="email" required placeholder="voce@email.com">
        </label>

        <label for="senhaCad">Senha
          <span class="campo-senha">
            <input type="password" id="senhaCad" name="senha" autocomplete="new-password" minlength="6" required placeholder="Mínimo de 6 caracteres">
            <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
          </span>
        </label>

        <label for="confirmaSenha">Confirmar senha
          <span class="campo-senha">
            <input type="password" id="confirmaSenha" name="confirmaSenha" autocomplete="new-password" required placeholder="Repita a senha">
            <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
          </span>
        </label>

        <label class="checkbox">
          <input type="checkbox" id="aceite" required>
          <span>Concordo em usar o FinCK como ferramenta educacional de finanças pessoais.</span>
        </label>

        <div class="captcha" id="captchaTrackCad">
          <div class="captcha-slider" id="captchaSliderCad" role="slider" aria-label="Deslize para verificar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Não verificado" tabindex="0">›</div>
          <span class="captcha-texto" id="captchaTextCad">Deslize para verificar →</span>
        </div>

        <p id="mensagemCad" class="mensagem" role="alert"></p>

        <button type="submit" id="btnCadastrar" class="btn-primario" disabled>Criar conta</button>
      </form>

      <div class="auth-rodape">
        <p>Já tem conta? <a href="index.html">Entrar</a></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reality.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-fx.js"></script>
  <script src="js/finck-fx.js"></script>
</body>
</html>
