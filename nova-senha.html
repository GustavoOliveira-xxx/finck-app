<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FinCK | Criar nova senha</title>
  <meta name="description" content="Defina uma nova senha para a sua conta FinCK.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon-finck.png" type="image/png">
  <meta name="theme-color" content="#07060a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icone-apple-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinCK">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style-auth.css">
  <link rel="stylesheet" href="css/finck-fx.css">
</head>
<body data-page="nova-senha" class="pagina-auth">
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <main class="auth-wrapper auth-wrapper--simples" id="conteudo" tabindex="-1">
    <section class="auth-card">
      <h1>Criar nova senha</h1>
      <p class="auth-sub">Escolha uma senha de pelo menos 6 caracteres.</p>

      <form id="novaSenhaForm" novalidate>
        <label for="senhaNova">Nova senha
          <span class="campo-senha">
            <input type="password" id="senhaNova" name="senha" autocomplete="new-password" minlength="6" required placeholder="Mínimo de 6 caracteres">
            <button type="button" class="toggle-senha" aria-label="Mostrar senha"></button>
          </span>
        </label>

        <label for="senhaNovaConfirma">Confirmar nova senha
          <span class="campo-senha">
            <input type="password" id="senhaNovaConfirma" name="confirma" autocomplete="new-password" required placeholder="Repita a senha">
            <button type="button" class="toggle-senha" aria-label="Mostrar senha"></button>
          </span>
        </label>

        <p id="msgNovaSenha" class="mensagem" role="alert"></p>

        <button type="submit" id="btnNovaSenha" class="btn-primario">Salvar nova senha</button>
      </form>

      <div class="auth-rodape">
        <p>Link expirado? <a href="recuperar.html">Pedir outro e-mail</a></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reality.js"></script>
  <script src="js/metas-engine.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-fx.js"></script>
  <script src="js/finck-fx.js"></script>
</body>
</html>
