<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCK | Entrar</title>
  <meta name="description" content="FinCK — descubra quanto uma compra custa em dinheiro e em tempo de trabalho antes de decidir.">
  <link rel="icon" href="assets/favicon-finck.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style-auth.css">
  <link rel="stylesheet" href="css/finck-fx.css">
</head>
<body data-page="login" class="pagina-auth">

  <div class="finck-carga" data-finck-carga aria-hidden="true">
    <div class="finck-carga__nucleo">
      <svg class="finck-carga__orbitas" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="finck-carga__anel finck-carga__anel--externo" cx="110" cy="110" r="104"/>
        <circle class="finck-carga__anel finck-carga__anel--medio" cx="110" cy="110" r="88"/>
        <g class="finck-carga__satelite-g">
          <circle class="finck-carga__satelite" cx="110" cy="6" r="5"/>
        </g>
        <g class="finck-carga__satelite-g finck-carga__satelite-g--2">
          <circle class="finck-carga__satelite finck-carga__satelite--roxo" cx="110" cy="22" r="3.5"/>
        </g>
      </svg>
      <img class="finck-carga__logo" src="assets/logo-ck.png" alt="" decoding="async">
    </div>
    <p class="finck-carga__marca">FinCK</p>
    <p class="finck-carga__frase">Traduzindo preço em tempo de vida…</p>
    <div class="finck-carga__barra"><span class="finck-carga__preenche"></span></div>
  </div>

  <main class="auth-wrapper">
    <section class="auth-marca cena3d" data-cena3d>
      <div class="cena3d__palco">
        <div class="cena3d__halo" aria-hidden="true"></div>
        <div class="cena3d__moedas" aria-hidden="true">
          <span class="cena3d__moeda cena3d__moeda--1"></span>
          <span class="cena3d__moeda cena3d__moeda--roxa cena3d__moeda--2"></span>
          <span class="cena3d__moeda cena3d__moeda--3"></span>
          <span class="cena3d__moeda cena3d__moeda--roxa cena3d__moeda--4"></span>
          <span class="cena3d__moeda cena3d__moeda--5"></span>
        </div>
        <span class="cena3d__logo-caixa">
          <img src="assets/logo-ck.png" alt="Conscious Knowledge" class="auth-logo">
          <span class="cena3d__brilho" aria-hidden="true"></span>
        </span>
        <h1 class="cena3d__titulo">FinCK</h1>
        <p class="auth-tagline cena3d__tagline">
          Descubra quanto uma compra custa em dinheiro, em tempo de trabalho
          e em espaço no seu futuro financeiro.
        </p>
      </div>
    </section>

    <section class="auth-card cena3d-eco" data-cena3d-eco>
      <h2>Entrar</h2>
      <p class="auth-sub">Acesse sua conta para continuar.</p>

      <form id="loginForm" novalidate>
        <label for="email">E-mail
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="voce@email.com">
        </label>

        <label for="senha">Senha
          <span class="campo-senha">
            <input type="password" id="senha" name="senha" autocomplete="current-password" required placeholder="••••••••">
            <button type="button" class="toggle-senha" aria-label="Mostrar senha">👁</button>
          </span>
        </label>

        <div class="captcha" id="captchaTrack">
          <div class="captcha-slider" id="captchaSlider" role="slider" aria-label="Deslize para verificar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Não verificado" tabindex="0">›</div>
          <span class="captcha-texto" id="captchaText">Deslize para verificar →</span>
        </div>

        <p id="mensagem" class="mensagem" role="alert"></p>

        <button type="submit" id="btnEntrar" class="btn-primario" disabled>Entrar</button>
      </form>

      <div class="auth-rodape">
        <p>Não tem conta? <a href="cadastro.html">Criar conta</a></p>
        <button type="button" id="btnDemo" class="btn-texto">Entrar no modo demonstração</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reality.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-fx.js"></script>
  <script src="js/finck-fx.js"></script>
</body>
</html>
