<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinCK | Metas</title>
  <meta name="description" content="Crie metas financeiras, faça aportes e veja como cada compra afeta seus planos.">
  <link rel="icon" href="assets/favicon-finck.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style-principal.css">
</head>
<body data-page="metas">

  <header data-finck-header></header>

  <main class="conteudo">
    <section class="hero">
      <h2>Metas</h2>
      <p>Cada meta é um contraponto ao consumo por impulso: o que você deixa de gastar aparece aqui.</p>
    </section>

    <section class="cards-indicadores" id="resumoMetas"></section>

    <section class="bloco">
      <div class="bloco-cabecalho">
        <h3>Suas metas</h3>
        <button type="button" class="btn-primario" id="btnNovaMeta">Nova meta</button>
      </div>
      <div id="listaMetas" class="grade-metas"></div>
      <p class="vazio" id="vazioMetas" hidden>Nenhuma meta cadastrada. Crie a primeira para acompanhar seu progresso.</p>
    </section>
  </main>

  <nav class="nav-inferior" data-finck-nav aria-label="Navegação principal"></nav>

  <!-- Nova meta -->
  <div id="modalMeta" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="tituloMeta">
    <div class="modal">
      <button type="button" class="fechar" data-fechar="modalMeta" aria-label="Fechar">✕</button>
      <h3 id="tituloMeta">Nova meta</h3>
      <form id="formMeta" novalidate>
        <input type="hidden" id="metaId">
        <label>Nome da meta
          <input type="text" id="metaNome" required placeholder="Ex.: Reserva de emergência">
        </label>
        <div class="linha-dupla">
          <label>Valor total (R$)
            <input type="number" id="metaAlvo" min="0.01" step="0.01" required placeholder="6000,00">
          </label>
          <label>Valor já guardado (R$)
            <input type="number" id="metaAtual" min="0" step="0.01" value="0">
          </label>
        </div>
        <div class="linha-dupla">
          <label>Data-limite
            <input type="date" id="metaPrazo">
          </label>
          <label>Rendimento mensal (%)
            <input type="number" id="metaTaxa" min="0" step="0.01" value="0">
          </label>
        </div>
        <button type="submit" class="btn-salvar">Salvar meta</button>
      </form>
    </div>
  </div>

  <!-- Aporte -->
  <div id="modalAporte" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="tituloAporte">
    <div class="modal">
      <button type="button" class="fechar" data-fechar="modalAporte" aria-label="Fechar">✕</button>
      <h3 id="tituloAporte">Novo aporte</h3>
      <form id="formAporte" novalidate>
        <input type="hidden" id="aporteMetaId">
        <p id="aporteInfo" class="descricao"></p>
        <label>Valor do aporte (R$)
          <input type="number" id="aporteValor" min="0.01" step="0.01" required placeholder="0,00">
        </label>
        <button type="submit" class="btn-salvar">Registrar aporte</button>
      </form>
    </div>
  </div>

  <!-- Detalhe -->
  <div id="modalDetalheMeta" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="tituloDetalheMeta">
    <div class="modal">
      <button type="button" class="fechar" data-fechar="modalDetalheMeta" aria-label="Fechar">✕</button>
      <h3 id="tituloDetalheMeta">Detalhe da meta</h3>
      <div id="conteudoDetalheMeta"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/reality.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/gamification-engine.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/metas.js"></script>
  <script src="js/ui-fx.js"></script>
</body>
</html>
